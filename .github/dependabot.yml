version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Minor and patch updates come grouped, one PR per dependency type. Each
    # major update gets its own PR, so one breaking change can't hold back the rest.
    groups:
      dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      devDependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Limit number of open PRs
    open-pull-requests-limit: 5
    # Add labels
    labels:
      - "dependencies"
      - "automated"
    # Commit message preferences
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    assignees:
      - "santiago-rico"
    
  # Enable version updates for Sanity Studio (if it has its own package.json)
  - package-ecosystem: "npm"
    directory: "/proense-asesora-digital"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "sanity-studio"
      - "automated"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
      
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "automated"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"