name: Dependabot auto-merge

# Turns on GitHub auto-merge (squash) for Dependabot's patch and minor updates,
# so they merge on their own once main's required check ("CI Summary") passes.
# Majors are left for a person: both production outages in October 2026 came
# from major bumps. For a grouped PR, update-type is the highest change in it,
# so a group containing a major is not auto-merged either.
#
# Needs, in the repository settings: "Allow auto-merge", and branch protection
# on main that requires the "CI Summary" check. Without a required check,
# auto-merge would merge immediately.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'santiago-rico/proense-asesora-digital'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
