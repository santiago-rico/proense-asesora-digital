name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Quality checks and tests
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      # tsc -b checks every project referenced by tsconfig.json (app, api, e2e);
      # a bare `tsc --noEmit` checks nothing, as the root config lists no files.
      - name: Run TypeScript type checking
        run: npm run typecheck
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run tests with coverage
        run: npm run test -- --run --coverage --reporter=verbose
        
      - name: Build application
        run: npm run build
        
      - name: Upload build artifacts
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist/
          retention-days: 7

  # Security checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
        
      - name: Run security tests (requires dev server)
        run: |
          # Start dev server in background
          npm run dev &
          DEV_PID=$!
          
          # Wait for server to be ready
          echo "Waiting for dev server to start..."
          sleep 30
          
          # Check if server is responding
          curl -f http://localhost:8080 || (echo "Dev server not ready" && exit 1)
          
          # Run security tests
          node test-multistep-form-security.js || echo "MultiStep security test completed"
          node test-modification-form-security.js || echo "Modification security test completed"
          
          # Kill dev server
          kill $DEV_PID
        continue-on-error: true # Security tests might fail if server setup is complex
        
      # Dependency review requires GitHub Advanced Security (not available for private repos)
      # - name: Check for vulnerable dependencies
      #   uses: actions/dependency-review-action@v4
      #   if: github.event_name == 'pull_request'

  # Deployment readiness check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build for production
        run: npm run build
        
      - name: Check build size
        run: |
          echo "Build size report:"
          du -sh dist/
          find dist/ -name "*.js" -exec du -h {} \; | sort -hr | head -10
          
      - name: Verify deployment files
        run: |
          echo "Checking essential files..."
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          test -d dist/assets || (echo "Missing assets directory" && exit 1)
          echo "All deployment files present"

  # Performance and bundle analysis
  performance:
    name: Performance Analysis
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build and analyze bundle
        run: |
          npm run build
          echo "Bundle analysis:"
          ls -la dist/assets/
          
      - name: Check bundle size limits
        run: |
          # Check if any JS files are larger than reasonable limits
          find dist/assets -name "*.js" -size +1M -exec echo "WARNING: Large bundle detected: {}" \;
          
          # Fail if any single JS file is larger than 3MB
          if find dist/assets -name "*.js" -size +3M | grep -q .; then
            echo "ERROR: Bundle size exceeds 3MB limit"
            exit 1
          fi
          
          echo "Bundle size check passed"

  # End-to-end tests (Playwright). The tests mock /api, so no secrets are needed;
  # playwright.config.ts builds the app and serves it with `vite preview` itself
  # (CI=true), so the suite tests the production bundle, not the dev server.
  e2e:
    # The suite covers every page and form on two viewports; on one runner it
    # would take ~40 min, so it is split across parallel shards. To resize, edit
    # the shard list only: the total comes from strategy.job-total.
    name: E2E Tests (Playwright ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Summary job to report overall status
  # The Sanity Studio (proense-asesora-digital/) is its own npm project; the
  # other jobs never install it, so its build broke on main unnoticed once.
  studio:
    name: Sanity Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proense-asesora-digital

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: proense-asesora-digital/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Type check
        run: npx tsc --noEmit

      - name: Build studio
        run: npx sanity build -y

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, security, deployment-check, performance, e2e, studio]
    if: always()
    
    steps:
      - name: Check all job results
        run: |
          echo "CI Pipeline Summary:"
          echo "==================="
          echo "Quality Check: ${{ needs.quality.result }}"
          echo "Security Audit: ${{ needs.security.result }}"
          echo "Deployment Check: ${{ needs.deployment-check.result }}"
          echo "Performance Analysis: ${{ needs.performance.result }}"
          echo "E2E Tests: ${{ needs.e2e.result }}"
          echo "Sanity Studio: ${{ needs.studio.result }}"

          # Fail if any critical job failed
          if [[ "${{ needs.quality.result }}" == "failure" ]]; then
            echo "❌ Quality checks failed"
            exit 1
          fi
          
          if [[ "${{ needs.deployment-check.result }}" == "failure" ]]; then
            echo "❌ Deployment readiness check failed"
            exit 1
          fi
          
          if [[ "${{ needs.performance.result }}" == "failure" ]]; then
            echo "❌ Performance checks failed"
            exit 1
          fi

          if [[ "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi

          if [[ "${{ needs.studio.result }}" == "failure" ]]; then
            echo "❌ Sanity Studio checks failed"
            exit 1
          fi
          
          echo "✅ All critical checks passed"